name: Playwright Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:  
      target_env:
        description: "Target environment"
        type: choice
        required: true
        options: [qa, staging, prod]
        default: staging
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Set env vars (login, base URL, etc.) here from GitHub Secrets.
      # Replace the secret names here 
      - name: Run Playwright tests
        env:
          # placeholders for env variables:
          EZRA_EMAIL: ${{ secrets.EZRA_EMAIL }}
          EZRA_PASSWORD: ${{ secrets.EZRA_PASSWORD }}
          EZRA_BASE_URL: ${{ secrets.EZRA_BASE_URL }}
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

